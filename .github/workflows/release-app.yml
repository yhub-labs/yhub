name: release-app

# 把 macOS 壳（Tauri）打进 Release 附件。
#
# 刻意和 `release.yml`（PyPI）分开：macOS runner 经常排队（2026-11 实测卡过 20 分钟以上），
# 一个卡住的壳构建不能把 Python 包的上传一起拖死。所以这里是独立工作流，失败不影响发版。
#
# 签名策略：**ad-hoc**（`signingIdentity: "-"`）。仓库里那个 "Y-Hub Local Dev" 是我本机的
# 自签证书，CI 上没有；而 arm64 的二进制至少要被签一次才能跑，所以不能省掉签名这一步。
# ad-hoc 签名不等于可分发签名：用户第一次打开会被 Gatekeeper 拦，需要右键 → 打开（或者
# `xattr -dr com.apple.quarantine`）。详见 docs/packaging.md。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 Release tag（例如 v0.1.1），把 dmg 补挂上去"
        required: true
        type: string

permissions:
  contents: write # gh release upload

concurrency:
  group: release-app-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-14 # arm64；Intel 需要另加 x86_64 target（见 docs/packaging.md）
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: 版本一致性
        run: ./scripts/check-versions.sh

      - name: tag 与 __version__ 一致
        run: |
          tag="${TAG#v}"
          ver="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' yhub/__init__.py)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ${TAG} 与 __version__ ${ver} 不一致 —— dmg 里的壳会和包对不上"
            exit 1
          fi
          echo "tag ${TAG} = __version__ ${ver}"

      - name: 前端依赖
        working-directory: web
        run: npm ci

      - name: Tauri CLI
        # 仓库里没有 tauri/package.json：本机靠 `cargo install tauri-cli` 的全局命令，
        # CI 上不存在。装到全局后**直接调 `tauri`**，不要写 `npx tauri` —— 本地没有这个包时
        # npx 会报 "could not determine executable to run"（2026-11-04 实测就是这么红的）。
        run: |
          npm install --global @tauri-apps/cli@2
          tauri --version

      - name: 构建 .app（ad-hoc 签名）
        run: |
          cd tauri
          tauri build --bundles app \
            --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - name: 组装 dmg（壳 + README + Applications 快捷方式）
        # 不用 Tauri 的 dmg 目标：它的 bundle_dmg.sh 靠 Finder/AppleScript 排版，本机跑都会失败
        # （要 CI=true 才跳过），而且没法往映像里塞 README。这里自己 hdiutil 拼，内容可控。
        run: |
          VER="${TAG#v}"
          APP="$PWD/tauri/target/release/bundle/macos/Y-Hub.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "Signature=adhoc" \
            || { echo "::error::壳不是 ad-hoc 签名"; exit 1; }
          test "$(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString)" = "$VER" \
            || { echo "::error::Info.plist 版本与 tag 不一致"; exit 1; }

          STAGE="$(mktemp -d)"
          ditto "$APP" "$STAGE/Y-Hub.app"
          ln -s /Applications "$STAGE/Applications"
          sed "s/@VERSION@/$VER/g" packaging/dmg/README.txt > "$STAGE/README.txt"

          mkdir -p dist
          DMG="dist/Y-Hub_${VER}_aarch64.dmg"
          hdiutil create -volname "Y-Hub $VER" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" | awk '{print $1}' > "$DMG.sha256"
          ls -lh "$DMG" "$DMG.sha256"

      - name: 核对 dmg 内容
        run: |
          DMG="$(ls dist/*.dmg)"
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly "$DMG" -mountpoint "$MNT" >/dev/null
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT
          test -f "$MNT/README.txt" || { echo "::error::dmg 里没有 README.txt"; exit 1; }
          test -f "$MNT/Y-Hub.app/Contents/Info.plist" || { echo "::error::dmg 里没有 App"; exit 1; }
          test -L "$MNT/Applications" || { echo "::error::dmg 里没有 Applications 快捷方式"; exit 1; }
          grep -q "${TAG#v}" "$MNT/README.txt" || { echo "::error::README 里的版本号不对"; exit 1; }
          codesign --verify --deep --strict "$MNT/Y-Hub.app"
          echo "PASS dmg：App + README.txt + Applications 链接，壳签名有效"

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/*.dmg dist/*.dmg.sha256 --clobber
