name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 前端依赖
        working-directory: web
        run: npm ci
      - name: 版本一致性
        run: ./scripts/check-versions.sh
      - name: 构建 wheel（前端 + 胶囊）
        run: make wheel
      - name: 后端接口全量验收
        run: make verify-backend
      - name: i18n catalog parity
        run: node scripts/verify-i18n.mjs
      - name: 显示文案的英文覆盖（TEXT_EN）
        run: uv run python scripts/verify-i18n-display.py
      - name: 插件安装/registry 验收
        run: uv run python scripts/verify-plugin-install.py
      - name: 外置插件机制验收
        working-directory: web
        run: node verify-plugins.mjs
      - name: Rust 单测（配置 / 后端桥接）
        working-directory: tauri
        run: cargo test
